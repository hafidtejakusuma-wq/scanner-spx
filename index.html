<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPX Express Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --spx-orange: #ee4d2d;
      --spx-orange-light: #ff7337;
      --bg-dark: #0f1117;
      --card-bg: #181b24;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --green-ok: #10b981;
      --yellow-warn: #f59e0b;
      --red-err: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overscroll-behavior-y: contain;
    }

    /* =====================================================================
       EFEK CAHAYA RUNNING MULTI-NEON + BORDER ORANYE STATIS UTUH
       ===================================================================== */
    @property --neon-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes spinNeonBorder {
      0% { --neon-angle: 0deg; }
      100% { --neon-angle: 360deg; }
    }

    .neon-card {
      position: relative;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      /* Garis tepi oranye statis asli tetap utuh */
      border: 1.5px solid var(--spx-orange);
      z-index: 1;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* Lapisan cahaya running multi-neon mengelilingi tepi luar kartu */
    .neon-card::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 19px;
      padding: 3px;
      background: conic-gradient(
        from var(--neon-angle),
        #ff003c, /* Merah */
        #00a2ff, /* Biru */
        #00ff66, /* Hijau */
        #ff7b00, /* Oranye */
        #ff1493, /* Pink */
        #ffe600, /* Kuning */
        #9d00ff, /* Ungu */
        #ff003c  /* Kembali ke Merah */
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: blur(4px) brightness(1.2);
      opacity: 0.92;
      z-index: -1;
      pointer-events: none;
      animation: spinNeonBorder 4s linear infinite;
    }

    /* =====================================================================
       HEADER & TOMBOL SENTER / ARSIP
       ===================================================================== */
    .header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .brand-title h1 span {
      color: var(--spx-orange);
    }

    .brand-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.93);
    }

    /* Tombol Senter: gradasi oranye sama dengan tombol kamera, putih terang saat aktif */
    #btnFlash {
      background: linear-gradient(135deg, var(--spx-orange), var(--spx-orange-light));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.45);
    }

    #btnFlash.flash-active {
      background: #ffffff;
      color: #111827;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.95);
    }

    #btnArchive {
      background: #252a37;
      color: #e5e7eb;
      border: 1px solid #374151;
    }

    /* =====================================================================
       PILIH KURIR & COUNTER REAL-TIME PER KURIR
       ===================================================================== */
    .kurir-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kurir-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .kurir-badge-count {
      background: rgba(238, 77, 45, 0.18);
      border: 1px solid var(--spx-orange);
      color: #ff9c87;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    select#kurirSelect {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: #10131a;
      color: #ffffff;
      border: 1.5px solid #374151;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    select#kurirSelect:focus {
      border-color: var(--spx-orange);
    }

    /* =====================================================================
       KAMERA SCANNER & KONTROL
       ===================================================================== */
    .scanner-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #090b10;
      min-height: 220px;
      border: 1px dashed #374151;
    }

    .btn-primary-cam {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--spx-orange), var(--spx-orange-light));
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(238, 77, 45, 0.45);
      transition: transform 0.15s ease;
    }

    .btn-primary-cam:active {
      transform: scale(0.98);
    }

    .btn-primary-cam.cam-stop {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    .manual-input-row {
      display: flex;
      gap: 8px;
    }

    .manual-input-row input {
      flex: 1;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #10131a;
      color: #ffffff;
      font-size: 0.9rem;
      text-transform: uppercase;
      outline: none;
    }

    .manual-input-row input:focus {
      border-color: var(--spx-orange);
    }

    .manual-input-row button {
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: #2b3140;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    /* =====================================================================
       STATUS ANTREAN (FORCE SYNC) & LOG TRANSMISI
       ===================================================================== */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #10131a;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #2a303d;
      font-size: 0.8rem;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green-ok);
      box-shadow: 0 0 8px var(--green-ok);
    }

    .dot-indicator.syncing {
      background: var(--yellow-warn);
      box-shadow: 0 0 10px var(--yellow-warn);
      animation: pulseDot 0.9s infinite alternate;
    }

    @keyframes pulseDot {
      from { transform: scale(0.85); opacity: 0.6; }
      to { transform: scale(1.25); opacity: 1; }
    }

    #queueBadgeBtn {
      background: #232836;
      color: #f3f4f6;
      border: 1px solid #4b5563;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #queueBadgeBtn.has-pending {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--yellow-warn);
      color: #fcd34d;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #d1d5db;
    }

    .log-list {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11141c;
      padding: 9px 11px;
      border-radius: 10px;
      border-left: 3.5px solid var(--yellow-warn);
      font-size: 0.8rem;
    }

    .log-item.saved { border-left-color: var(--green-ok); }
    .log-item.error, .log-item.duplicate { border-left-color: var(--red-err); }

    .log-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .log-resi {
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .log-meta {
      font-size: 0.71rem;
      color: var(--text-muted);
    }

    .log-status {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
    }

    .log-item.saved .log-status {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
    }

    .log-item.error .log-status,
    .log-item.duplicate .log-status {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
    }

    /* =====================================================================
       HARD BLOCK BANNER SAAT ADA PENGIRIMAN AKTIF
       ===================================================================== */
    #hardBlockWarning {
      display: none;
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: linear-gradient(135deg, #b91c1c, #ea580c);
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
      border: 1.5px solid #fca5a5;
    }
  </style>
</head>
<body>

  <!-- KARTU 1: HEADER & TOMBOL SENTER / ARSIP -->
  <div class="neon-card header-card">
    <div class="brand-title">
      <h1><span>SPX</span> EXPRESS SCANNER</h1>
      <div class="brand-sub" id="wakeLockStatus">Mode Siaga • Anti-Hilang Data Aktif</div>
    </div>
    <div class="header-actions">
      <button id="btnFlash" class="icon-btn" title="Senter Kamera" onclick="toggleFlash()">🔦</button>
      <button id="btnArchive" class="icon-btn" title="Arsipkan Data" onclick="promptArchive()">🤖</button>
    </div>
  </div>

  <!-- KARTU 2: PILIH KURIR & COUNTER REAL-TIME PER KURIR -->
  <div class="neon-card kurir-section">
    <div class="kurir-label-row">
      <span>NAMA KURIR BERTUGAS</span>
      <span class="kurir-badge-count" id="kurirCounterBadge">PILIH KURIR: 0 RESI</span>
    </div>
    <select id="kurirSelect" onchange="updateKurirCounterUI()">
      <option value="">-- Memuat Daftar Kurir... --</option>
    </select>
  </div>

  <!-- KARTU 3: KAMERA PEMINDAI & INPUT MANUAL -->
  <div class="neon-card scanner-wrapper">
    <div id="reader"></div>
    <button id="btnToggleCam" class="btn-primary-cam" onclick="toggleCamera()">📷 MULAI SCAN BARCODE</button>
    <div class="manual-input-row">
      <input type="text" id="manualResiInput" placeholder="Ketik / tempel resi manual..." onkeydown="if(event.key==='Enter') handleManualInput()" />
      <button onclick="handleManualInput()">KIRIM</button>
    </div>
  </div>

  <!-- KARTU 4: STATUS ANTREAN (FORCE SYNC) & LOG TRANSMISI -->
  <div class="neon-card">
    <div class="status-bar">
      <div class="status-left">
        <div id="statusDot" class="dot-indicator"></div>
        <span id="statusText">Terhubung • Siap Scan</span>
      </div>
      <button id="queueBadgeBtn" onclick="forceSyncNow()" title="Ketuk untuk paksa kirim ulang sekarang">
        Antrean: 0
      </button>
    </div>

    <div class="log-header">
      <span>LOG TRANSMISI REAL-TIME</span>
      <span id="totalScanCounter">Total Sesi: 0 SCAN</span>
    </div>
    <div class="log-list" id="logList"></div>
  </div>

  <!-- PERINGATAN HARD BLOCK SAAT TOMBOL BACK DITEKAN KETIKA MASIH MENGIRIM -->
  <div id="hardBlockWarning">
    ⚠️ JANGAN KELUAR! Masih ada resi berstatus MENGIRIM ke server...
  </div>

  <script>
    // =========================================================================
    // KONFIGURASI WEB APP URL & KUNCI PENYIMPANAN LOKAL
    // =========================================================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzgdXi9GUYGHxeo71WL-Ki-cedn2fu38A1tJV2bGPCjOHU-A_hh9TrMIstEDcnH3npIqA/exec';
    const STORAGE_QUEUE_KEY = 'spx_pending_upload_queue_v1';
    const STORAGE_COUNTS_KEY = 'spx_kurir_session_counts_v1';

    let html5QrCode = null;
    let isCameraRunning = false;
    let isFlashOn = false;
    let wakeLock = null;

    let uploadQueue = [];
    let isSyncing = false;
    let localCache = new Set();
    let kurirCounts = {};
    let totalSessionScans = 0;

    // =========================================================================
    // INISIALISASI SAAT HALAMAN DIMUAT
    // =========================================================================
    window.onload = async function () {
      restoreFromLocalStorage();
      setupHardBlockNavigation();
      await loadKurirList();
      // Jalankan siklus pengiriman batch tiap 2,5 detik
      setInterval(() => prosesAntreanBatch(false), 2500);
      // Jika ada sisa antrean dari sesi sebelumnya yang sempat terputus, langsung kirim
      if (uploadQueue.length > 0) {
        prosesAntreanBatch(false);
      }
    };

    // =========================================================================
    // PENYIMPANAN PERMANEN ANTI-HILANG DATA (localStorage)
    // =========================================================================
    function saveQueueToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_QUEUE_KEY, JSON.stringify(uploadQueue));
        localStorage.setItem(STORAGE_COUNTS_KEY, JSON.stringify({
          kurirCounts: kurirCounts,
          totalSessionScans: totalSessionScans
        }));
      } catch (e) {
        console.warn('Gagal menyimpan ke localStorage:', e);
      }
    }

    function restoreFromLocalStorage() {
      try {
        const savedQueue = localStorage.getItem(STORAGE_QUEUE_KEY);
        if (savedQueue) {
          const parsed = JSON.parse(savedQueue);
          if (Array.isArray(parsed) && parsed.length > 0) {
            uploadQueue = parsed.map(item => ({ ...item, isRetry: true }));
            uploadQueue.forEach(item => {
              localCache.add(item.kurir + '_' + item.resi);
              renderLogItem(item, 'MENGIRIM...', '');
            });
          }
        }

        const savedCounts = localStorage.getItem(STORAGE_COUNTS_KEY);
        if (savedCounts) {
          const parsedCounts = JSON.parse(savedCounts);
          kurirCounts = parsedCounts.kurirCounts || {};
          totalSessionScans = parsedCounts.totalSessionScans || 0;
          document.getElementById('totalScanCounter').textContent = `Total Sesi: ${totalSessionScans} SCAN`;
        }
        updateQueueUI();
      } catch (e) {
        console.warn('Gagal memulihkan dari localStorage:', e);
      }
    }

    // =========================================================================
    // HARD BLOCK NAVIGATION & PENGIRIMAN DARURAT SAAT KELUAR / MINIMIZE
    // =========================================================================
    function setupHardBlockNavigation() {
      // Dorong state history agar tombol Back HP bisa dicegat
      history.pushState({ spxGuard: true }, '', location.href);

      window.addEventListener('popstate', function () {
        if (uploadQueue.length > 0 || isSyncing) {
          // Cegat tombol Back HP saat masih ada resi berstatus MENGIRIM
          history.pushState({ spxGuard: true }, '', location.href);
          playBeep('error');
          showHardBlockBanner();
          prosesAntreanBatch(false);
        }
      });

      // Cegat tutup tab / refresh browser saat masih ada antrean
      window.addEventListener('beforeunload', function (e) {
        if (uploadQueue.length > 0 || isSyncing) {
          saveQueueToLocalStorage();
          e.preventDefault();
          e.returnValue = 'Masih ada resi yang belum terkirim ke server!';
          return e.returnValue;
        }
      });

      // Kirim darurat seketika saat kurir menekan tombol Home / pindah aplikasi
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden' && uploadQueue.length > 0) {
          saveQueueToLocalStorage();
          prosesAntreanBatch(true); // Mode darurat keepalive
        }
      });

      window.addEventListener('pagehide', function () {
        if (uploadQueue.length > 0) {
          saveQueueToLocalStorage();
          prosesAntreanBatch(true); // Mode darurat keepalive
        }
      });
    }

    function showHardBlockBanner() {
      const banner = document.getElementById('hardBlockWarning');
      banner.textContent = `⚠️ JANGAN KELUAR! Masih ada ${uploadQueue.length} resi berstatus MENGIRIM...`;
      banner.style.display = 'block';
      clearTimeout(window._bannerTimer);
      window._bannerTimer = setTimeout(() => {
        banner.style.display = 'none';
      }, 4000);
    }

    // =========================================================================
    // MUAT DAFTAR KURIR DARI GOOGLE SCRIPT
    // =========================================================================
    async function loadKurirList() {
      const select = document.getElementById('kurirSelect');
      try {
        const res = await fetch(WEB_APP_URL);
        const data = await res.json();
        const list = data.kurir || [];
        select.innerHTML = '<option value="">-- PILIH NAMA KURIR --</option>';
        list.forEach(nama => {
          const opt = document.createElement('option');
          opt.value = nama;
          opt.textContent = nama;
          select.appendChild(opt);
        });
        updateKurirCounterUI();
      } catch (err) {
        select.innerHTML = '<option value="">Gagal memuat kurir (Cek koneksi)</option>';
      }
    }

    function updateKurirCounterUI() {
      const kurir = document.getElementById('kurirSelect').value;
      const badge = document.getElementById('kurirCounterBadge');
      if (!kurir) {
        badge.textContent = 'PILIH KURIR: 0 RESI';
        return;
      }
      const count = kurirCounts[kurir] || 0;
      badge.textContent = `${kurir}: ${count} RESI`;
    }

    // =========================================================================
    // SCREEN WAKE LOCK (LAYAR TETAP MENYALA SAAT KAMERA AKTIF)
    // =========================================================================
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wakeLockStatus').textContent = 'Layar Terkunci Menyala • Anti-Hilang Data';
        }
      } catch (err) {
        console.warn('WakeLock tidak didukung/ditolak:', err);
      }
    }

    async function releaseWakeLock() {
      try {
        if (wakeLock !== null) {
          await wakeLock.release();
          wakeLock = null;
        }
        document.getElementById('wakeLockStatus').textContent = 'Mode Siaga • Anti-Hilang Data Aktif';
      } catch (err) {
        console.warn('Gagal melepas WakeLock:', err);
      }
    }

    // =========================================================================
    // KAMERA SCANNER & KONTROL SENTER
    // =========================================================================
    async function toggleCamera() {
      const btn = document.getElementById('btnToggleCam');
      if (!isCameraRunning) {
        const kurir = document.getElementById('kurirSelect').value;
        if (!kurir) {
          alert('Silakan pilih NAMA KURIR terlebih dahulu sebelum mulai scan!');
          return;
        }
        try {
          if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
          }
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: { width: 260, height: 140 } },
            onScanSuccess
          );
          isCameraRunning = true;
          btn.textContent = '⏹️ MATIKAN KAMERA';
          btn.classList.add('cam-stop');
          await requestWakeLock();
        } catch (err) {
          alert('Gagal mengakses kamera: ' + err);
        }
      } else {
        try {
          if (isFlashOn) await toggleFlash(true);
          await html5QrCode.stop();
          isCameraRunning = false;
          btn.textContent = '📷 MULAI SCAN BARCODE';
          btn.classList.remove('cam-stop');
          await releaseWakeLock();
        } catch (err) {
          console.error(err);
        }
      }
    }

    async function toggleFlash(forceOff = false) {
      const btnFlash = document.getElementById('btnFlash');
      if (!isCameraRunning || !html5QrCode) {
        alert('Nyalakan kamera terlebih dahulu untuk menggunakan senter.');
        return;
      }
      try {
        const nextState = forceOff ? false : !isFlashOn;
        await html5QrCode.applyVideoConstraints({
          advanced: [{ torch: nextState }]
        });
        isFlashOn = nextState;
        if (isFlashOn) {
          btnFlash.classList.add('flash-active');
          btnFlash.textContent = '💡';
        } else {
          btnFlash.classList.remove('flash-active');
          btnFlash.textContent = '🔦';
        }
      } catch (err) {
        alert('Perangkat/kamera ini tidak mendukung kontrol senter langsung.');
      }
    }

    // =========================================================================
    // PEMROSESAN HASIL SCAN & FORMAT TIMESTAMP LOKAL (0 DETIK SELISIH)
    // =========================================================================
    function getFormattedLocalTimestamp() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    function handleManualInput() {
      const input = document.getElementById('manualResiInput');
      const val = input.value.trim().toUpperCase();
      if (!val) return;
      input.value = '';
      onScanSuccess(val);
    }

    function onScanSuccess(decodedText) {
      const kurir = document.getElementById('kurirSelect').value;
      if (!kurir) {
        playBeep('error');
        alert('Pilih NAMA KURIR terlebih dahulu!');
        return;
      }

      const resi = String(decodedText || '').trim().toUpperCase();
      if (!resi.startsWith('SPXID06') && !resi.startsWith('ID')) {
        return; // Abaikan barcode selain resi SPX/ID
      }

      const cacheKey = kurir + '_' + resi;
      if (localCache.has(cacheKey)) {
        return; // Cegah spam pembacaan kamera dalam milidetik yang sama
      }

      localCache.add(cacheKey);
      playBeep('success');

      const timestamp = getFormattedLocalTimestamp();
      const itemId = 'scan_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

      const newItem = {
        id: itemId,
        kurir: kurir,
        resi: resi,
        timestamp: timestamp,
        isRetry: false
      };

      uploadQueue.push(newItem);
      saveQueueToLocalStorage();

      // Update counter sesi & counter per kurir
      totalSessionScans++;
      kurirCounts[kurir] = (kurirCounts[kurir] || 0) + 1;
      document.getElementById('totalScanCounter').textContent = `Total Sesi: ${totalSessionScans} SCAN`;
      updateKurirCounterUI();

      renderLogItem(newItem, 'MENGIRIM...', '');
      updateQueueUI();
    }

    // =========================================================================
    // PENGIRIMAN BATCH (25 RESI PER PAKET) & FORCE SYNC
    // =========================================================================
    function forceSyncNow() {
      if (uploadQueue.length === 0) {
        alert('Semua data sudah terkirim (Antrean: 0).');
        return;
      }
      prosesAntreanBatch(false);
    }

    async function prosesAntreanBatch(isEmergencyKeepalive = false) {
      if (uploadQueue.length === 0) return;
      if (isSyncing && !isEmergencyKeepalive) return;

      isSyncing = true;
      updateQueueUI();

      const batchToSend = uploadQueue.slice(0, 25);
      const sentIds = new Set(batchToSend.map(i => i.id));

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          keepalive: isEmergencyKeepalive,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'batch_scan',
            items: batchToSend
          })
        });

        const data = await response.json();

        if (data.status === 'busy') {
          // Tandai retry agar tidak memicu alarm duplikat palsu
          uploadQueue.forEach(item => {
            if (sentIds.has(item.id)) item.isRetry = true;
          });
          saveQueueToLocalStorage();
          document.getElementById('statusText').textContent = 'Antrean padat, mencoba ulang...';
        } else if (data.status === 'success') {
          const results = data.results || [];
          const resultMap = new Map(results.map(r => [r.id, r]));

          // Hapus item yang sudah selesai diproses dari uploadQueue & localStorage
          uploadQueue = uploadQueue.filter(item => !sentIds.has(item.id));
          saveQueueToLocalStorage();

          batchToSend.forEach(origItem => {
            const res = resultMap.get(origItem.id);
            if (!res) return;

            if (res.status === 'saved') {
              updateLogItemStatus(origItem.id, `TERSIMPAN (#${res.no})`, 'saved');
            } else if (res.status === 'duplicate') {
              if (origItem.isRetry) {
                // Ternyata sudah masuk saat percobaan sebelum sinyal putus
                updateLogItemStatus(origItem.id, 'TERSIMPAN', 'saved');
              } else {
                playBeep('error');
                updateLogItemStatus(origItem.id, 'DUPLIKAT DI SHEET', 'duplicate');
              }
            } else {
              playBeep('error');
              updateLogItemStatus(origItem.id, res.message || 'GAGAL', 'error');
            }
          });
        }
      } catch (err) {
        // Jaringan putus / timeout: tandai isRetry = true dan simpan di localStorage
        uploadQueue.forEach(item => {
          if (sentIds.has(item.id)) item.isRetry = true;
        });
        saveQueueToLocalStorage();
        document.getElementById('statusText').textContent = 'Sinyal terganggu, mengantre ulang...';
      } finally {
        isSyncing = false;
        updateQueueUI();
      }
    }

    // =========================================================================
    // ARSIPKAN DATA (PASSWORD: 1110)
    // =========================================================================
    async function promptArchive() {
      if (uploadQueue.length > 0 || isSyncing) {
        alert('Tunggu hingga seluruh antrean pengiriman selesai (Antrean: 0) sebelum mengarsipkan!');
        return;
      }
      const pwd = prompt('Masukkan Password Arsip untuk memindahkan semua data ke Resi History:');
      if (!pwd) return;

      try {
        document.getElementById('statusText').textContent = 'Mengarsipkan seluruh sheet kurir...';
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'archive',
            password: pwd
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert('✅ ' + data.message);
          // Reset penyimpanan lokal & counter sesi setelah arsip sukses
          uploadQueue = [];
          localCache.clear();
          kurirCounts = {};
          totalSessionScans = 0;
          localStorage.removeItem(STORAGE_QUEUE_KEY);
          localStorage.removeItem(STORAGE_COUNTS_KEY);
          document.getElementById('logList').innerHTML = '';
          document.getElementById('totalScanCounter').textContent = 'Total Sesi: 0 SCAN';
          updateKurirCounterUI();
          updateQueueUI();
        } else {
          alert('❌ ' + (data.message || 'Gagal mengarsipkan data.'));
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan saat arsip: ' + err);
      }
    }

    // =========================================================================
    // PEMBARUAN TAMPILAN UI LOG & INDIKATOR ANTREAN
    // =========================================================================
    function updateQueueUI() {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const badgeBtn = document.getElementById('queueBadgeBtn');

      badgeBtn.textContent = `Antrean: ${uploadQueue.length}`;

      if (uploadQueue.length > 0 || isSyncing) {
        dot.classList.add('syncing');
        badgeBtn.classList.add('has-pending');
        statusText.textContent = `Mengirim ${uploadQueue.length} resi ke server...`;
      } else {
        dot.classList.remove('syncing');
        badgeBtn.classList.remove('has-pending');
        statusText.textContent = 'Terhubung • Semua Terkirim';
        document.getElementById('hardBlockWarning').style.display = 'none';
      }
    }

    function renderLogItem(item, statusLabel, statusClass) {
      const list = document.getElementById('logList');
      if (document.getElementById('log_' + item.id)) return;

      const div = document.createElement('div');
      div.id = 'log_' + item.id;
      div.className = 'log-item ' + statusClass;
      div.innerHTML = `
        <div class="log-info">
          <span class="log-resi">${item.resi}</span>
          <span class="log-meta">${item.kurir} • ${item.timestamp}</span>
        </div>
        <span class="log-status" id="status_${item.id}">${statusLabel}</span>
      `;
      list.prepend(div);
    }

    function updateLogItemStatus(itemId, newLabel, newClass) {
      const row = document.getElementById('log_' + itemId);
      const badge = document.getElementById('status_' + itemId);
      if (row) {
        row.className = 'log-item ' + newClass;
      }
      if (badge) {
        badge.textContent = newLabel;
      }
    }

    // =========================================================================
    // EFEK SUARA BEEP (SUKSES & ERROR/DUPLIKAT)
    // =========================================================================
    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1050, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.09);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.32);
        }
      } catch (e) {}
    }
  </script>
