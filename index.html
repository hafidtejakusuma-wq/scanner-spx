<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPX Express Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #070402;
      --bg-card: rgba(18, 11, 7, 0.86);
      --orange-neon: #ff5500;
      --orange-bright: #ff8c00;
      --orange-glow: rgba(255, 85, 0, 0.45);
      --orange-dim: rgba(255, 85, 0, 0.14);
      --green-neon: #10b981;
      --yellow-neon: #f59e0b;
      --red-neon: #ef4444;
      --text-main: #f4f4f5;
      --text-sub: #d4d4d8;
      --border-color: rgba(255, 107, 0, 0.65);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      margin: 0; padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark); 
      color: var(--text-main); 
    }

    /* 1. VIDEO BACKGROUND HUD ASLI BERWARNA ORANGE */
    .bg-video-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      filter: hue-rotate(175deg) saturate(300%) brightness(1.25) contrast(1.22);
      z-index: 0;
      pointer-events: none;
    }

    .bg-hud-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 8, 3, 0.10) 0%, rgba(5, 3, 2, 0.42) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 2. LAYOUT 1 LAYAR PENUH (100dvh) */
    .container { 
      max-width: 480px; 
      height: 100dvh;
      margin: 0 auto; 
      padding: 4px 12px 10px 12px;
      position: relative; 
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    
    /* HEADER BARIS ATAS */
    .header { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      padding-top: 2px;
      flex-shrink: 0;
      position: relative;
    }

    .brand-center {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 50px;
      position: relative;
    }

    .robot-mascot {
      width: 60px;
      height: 50px;
      object-fit: contain;
      cursor: pointer;
      margin-right: -2px;
      z-index: 3;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 4px 10px rgba(255, 85, 0, 0.55));
      animation: robotFloat 3.2s ease-in-out infinite;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .robot-mascot:active { transform: scale(0.92); }
    .robot-mascot.robot-happy { animation: robotCheer 0.55s ease; }

    @keyframes robotFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(2px) rotate(1.5deg); }
    }
    @keyframes robotCheer {
      0%   { transform: scale(1) translateY(0); }
      35%  { transform: scale(1.14) translateY(1px) rotate(6deg); }
      70%  { transform: scale(0.96) translateY(2px) rotate(-3deg); }
      100% { transform: scale(1) translateY(0); }
    }

    .center-logo {
      width: 100px;
      height: 40px;
      object-fit: contain;
      margin-bottom: -2px;
      z-index: 2;
      filter: drop-shadow(0 0 10px rgba(255, 85, 0, 0.7));
    }

    /* TOMBOL IKON POJOK KIRI & KANAN ATAS */
    .icon-corner-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 12px;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s ease;
    }
    .icon-corner-btn:active:not(:disabled) { transform: scale(0.92); }
    .icon-corner-btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-cam-start { 
      background: linear-gradient(135deg, #ff7b00, #ff3d00); 
      color: #fff; 
      border: 1px solid rgba(255, 160, 80, 0.5);
      box-shadow: 0 4px 14px var(--orange-glow); 
    }
    .btn-cam-stop { 
      background: rgba(20, 12, 8, 0.88); 
      color: var(--orange-bright); 
      border: 1.5px solid var(--orange-neon); 
      box-shadow: inset 0 0 10px rgba(255, 85, 0, 0.25);
    }
    .btn-torch-off { 
      background: linear-gradient(135deg, #ff7b00, #ff3d00); 
      color: #fff; 
      border: 1px solid rgba(255, 160, 80, 0.5);
      box-shadow: 0 4px 14px var(--orange-glow); 
    }
    .btn-torch-on { 
      background: #fff; 
      color: #000; 
      border: 1px solid #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.85); 
    }

    @media (max-width: 350px) {
      .header { height: 48px; }
      .brand-center { height: 45px; }
      .robot-mascot { width: 54px; height: 45px; margin-right: -1px; }
      .center-logo { width: 90px; height: 36px; }
      .icon-corner-btn { width: 38px; height: 38px; font-size: 17px; }
    }

    /* KARTU GLASSMORPHISM DENGAN EFEK RUNNING MULTI-NEON */
    .card { 
      position: relative;
      border-radius: 14px;
      padding: 2px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      transition: transform 0.2s ease, box-shadow 0.25s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220%;
      height: 220%;
      background: conic-gradient(
        from 0deg,
        #ff003c 0deg,
        #00d4ff 52deg,
        #00ff66 104deg,
        #ff6a00 156deg,
        #ff00cc 208deg,
        #ffe600 260deg,
        #9d00ff 312deg,
        #ff003c 360deg
      );
      transform: translate(-50%, -50%) rotate(0deg);
      animation: neonBorderSpin 4.2s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes neonBorderSpin {
      0%   { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .card-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      border-radius: 12px;
      padding: 8px 10px;
      border: 1.5px solid var(--border-color);
      box-shadow: inset 0 0 14px rgba(255, 85, 0, 0.08);
      transition: border-color 0.25s ease;
    }
    .card-inner::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange-neon), transparent);
      pointer-events: none;
    }

    label { display: block; font-size: 10px; font-weight: 700; color: var(--text-sub); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.9px; }

    .kurir-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .kurir-top-row label { margin-bottom: 0; }
    .kurir-scan-pill {
      font-size: 10px;
      font-weight: 800;
      color: var(--orange-bright);
      background: var(--orange-dim);
      border: 1px solid rgba(255, 107, 0, 0.55);
      padding: 1px 8px;
      border-radius: 99px;
      letter-spacing: 0.4px;
    }
    
    select, input[type="text"] {
      width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.85); color: var(--text-main); font-size: 14px; font-weight: 600;
      outline: none; transition: all 0.25s ease;
    }
    select:focus, input[type="text"]:focus { 
      border-color: var(--orange-neon); 
      box-shadow: 0 0 0 2px var(--orange-dim); 
    }
    select.select-empty {
      color: var(--orange-bright);
      border-color: rgba(255, 140, 0, 0.6);
    }

    /* Skeleton Screen */
    .skeleton-box {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(110deg, rgba(35, 22, 14, 0.9) 25%, rgba(255, 95, 0, 0.25) 50%, rgba(35, 22, 14, 0.9) 75%);
      background-size: 200% 100%;
      border: 1px solid rgba(255, 107, 0, 0.25);
      animation: skeletonShimmer 1.3s infinite linear;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: rgba(255, 160, 80, 0.75);
    }
    @keyframes skeletonShimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Bar Status Antrean Sinkronisasi + Tombol Force Sync */
    .sync-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.82); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 6px 12px; font-size: 11px;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }
    .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #10b981; }
    .sync-dot.busy { background: #ff6b00; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .queue-force-btn {
      color: var(--orange-bright);
      font-weight: 700;
      cursor: pointer;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .queue-force-btn.pending {
      background: rgba(255, 85, 0, 0.2);
      border-color: var(--orange-neon);
      animation: pulse 1.1s infinite;
    }
    .queue-force-btn:active { transform: scale(0.94); }

    #statusBox {
      display: none; padding: 7px 10px; border-radius: 10px;
      font-size: 12px; font-weight: 700; text-align: center;
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }
    .status-success { display: block !important; background: rgba(16, 185, 129, 0.22); border: 1px solid #10b981; color: #34d399; }
    .status-duplicate { display: block !important; background: rgba(245, 158, 11, 0.22); border: 1px solid #f59e0b; color: #fbbf24; }
    .status-error { display: block !important; background: rgba(239, 68, 68, 0.22); border: 1px solid #ef4444; color: #f87171; }

    /* KARTU KAMERA LEBIH LUAS & CEPAT */
    .scanner-card {
      flex: 1;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .scanner-card .card-inner {
      display: flex;
      flex-direction: column;
      padding: 7px;
    }

    #reader-wrapper { 
      position: relative; width: 100%; height: 100%;
      border-radius: 10px; overflow: hidden; 
      background: #000; 
      border: 1px solid var(--border-color);
      transition: all 0.25s ease;
    }
    #reader { width: 100%; height: 100%; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }

    .cam-corners {
      position: absolute;
      inset: 12px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.35;
      transition: opacity 0.3s ease;
    }
    .cam-active .cam-corners {
      opacity: 1;
      animation: cornerPulse 1.8s ease-in-out infinite;
    }
    .cam-corners span {
      position: absolute;
      width: 22px; height: 22px;
      border-color: var(--orange-neon);
      border-style: solid;
    }
    .cam-corners span:nth-child(1) { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
    .cam-corners span:nth-child(2) { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 6px; }
    .cam-corners span:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 6px; }
    .cam-corners span:nth-child(4) { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }

    @keyframes cornerPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.97); }
    }

    .manual-row { display: flex; gap: 8px; }
    .manual-row input { flex: 1; }
    .btn-manual { 
      padding: 10px 14px; border-radius: 10px; font-size: 12px; font-weight: 700;
      cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
      background: var(--orange-dim); color: var(--orange-bright); border: 1px solid var(--orange-neon); 
      transition: transform 0.15s ease;
    }
    .btn-manual:active { transform: scale(0.94); }

    /* Visual Feedback */
    .flash-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 998; opacity: 0; }
    .flash-success { animation: flashGreen 0.45s ease-out; }
    .flash-duplicate { animation: flashYellow 0.5s ease-out; }
    .flash-error { animation: flashRed 0.5s ease-out; }
    @keyframes flashGreen { 0% { opacity: 0.38; background: radial-gradient(circle, transparent 35%, rgba(16, 185, 129, 0.75) 100%); } 100% { opacity: 0; } }
    @keyframes flashYellow { 0% { opacity: 0.42; background: radial-gradient(circle, transparent 35%, rgba(245, 158, 11, 0.8) 100%); } 100% { opacity: 0; } }
    @keyframes flashRed { 0% { opacity: 0.45; background: radial-gradient(circle, transparent 35%, rgba(239, 68, 68, 0.85) 100%); } 100% { opacity: 0; } }

    .shake-anim { animation: horizontalShake 0.42s cubic-bezier(.36,.07,.19,.97) both; }
    .shake-anim .card-inner { border-color: var(--red-neon) !important; }
    .pulse-success-card .card-inner { border-color: var(--green-neon) !important; }
    @keyframes horizontalShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* LOG TRANSMISI: 2 BARIS & TETAP BISA DI-SCROLL */
    .history-card {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .history-card .card-inner {
      display: flex;
      flex-direction: column;
      padding: 7px 10px;
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-shrink: 0; }
    .badge { background: var(--orange-neon); color: #fff; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; }
    
    .history-list { 
      height: 92px;
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
    }
    
    .history-item {
      background: rgba(0, 0, 0, 0.82); padding: 6px 10px; border-radius: 8px; 
      border-left: 3px solid #f59e0b;
      display: flex; justify-content: space-between; align-items: center; font-size: 12px;
      flex-shrink: 0;
      min-height: 42px;
    }
    .history-item.synced { border-left-color: #10b981; }
    .history-item.dup { border-left-color: #ef4444; opacity: 0.72; }
    .history-resi { font-weight: 700; color: #fff; font-family: monospace; font-size: 13px; }
    .history-meta { font-size: 10px; color: var(--text-sub); margin-top: 1px; }
    .tag-status { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
    .tag-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .tag-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .tag-dup { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* MODAL ARSIP BERPASSWORD 1110 */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(6px); z-index: 999;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 330px; background: #140c08;
      border: 1.5px solid var(--orange-neon); border-radius: 16px;
      padding: 18px; text-align: center; box-shadow: 0 0 28px var(--orange-glow);
    }
    .modal-title { font-size: 15px; font-weight: 800; color: var(--orange-bright); margin-bottom: 8px; letter-spacing: 0.8px; }
    .modal-desc { font-size: 13px; color: var(--text-sub); line-height: 1.4; margin-bottom: 12px; }
    .modal-pass {
      width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--orange-neon);
      background: #000; color: #fff; font-size: 18px; font-weight: 800;
      text-align: center; letter-spacing: 5px; margin-bottom: 12px; outline: none;
    }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal-btns button {
      padding: 10px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-modal-cancel { background: #27272a; color: #d4d4d8; }
    .btn-modal-ok { background: linear-gradient(135deg, #ff7b00, #ff3d00); color: #fff; }
  </style>
</head>
<body>
  <!-- Video Background HUD Asli -->
  <video id="bgHudVideo" class="bg-video-layer" autoplay loop muted playsinline preload="auto">
    <source src="bg-hud.mp4.mp4" type="video/mp4">
    <source src="bg-hud.mp4" type="video/mp4">
  </video>
  <div class="bg-hud-overlay"></div>

  <!-- Layer Kilatan Visual Feedback -->
  <div id="flashOverlay" class="flash-overlay"></div>

  <div class="container">
    <!-- HEADER: Ikon Kamera (Kiri) + Robot & Logo SPX (Tengah) + Ikon Senter (Kanan) -->
    <div class="header">
      <button id="btnKamera" class="icon-corner-btn btn-cam-start" onclick="toggleKamera()" title="Aktifkan / Matikan Kamera">📷</button>
      
      <div class="brand-center">
        <img src="robot-header.gif" alt="SPX Robot Arsip" id="robotMascot" class="robot-mascot" onclick="bukaModalArsip()" title="Klik untuk Arsip & Reset 32 Sheet Kurir">
        <img src="logo-header.png" alt="SPX Express" class="center-logo">
      </div>

      <button id="btnSenter" class="icon-corner-btn btn-torch-off" onclick="toggleSenter()" disabled title="Nyalakan / Matikan Senter">🔦</button>
    </div>

    <!-- Kartu Pemilihan Kurir + Counter Riil dari Sheet -->
    <div class="card" id="kurirCard">
      <div class="card-inner">
        <div class="kurir-top-row">
          <label for="kurirSelect">Kurir Bertugas</label>
          <span class="kurir-scan-pill" id="kurirCounterPill">KURIR: 0 RESI</span>
        </div>
        <div id="kurirSkeleton" class="skeleton-box">MENGHUBUNGKAN DATABASE KURIR...</div>
        <select id="kurirSelect" class="select-empty" style="display:none;" onchange="onKurirChange()">
          <option value="">-- PILIH NAMA KURIR --</option>
        </select>
      </div>
    </div>

    <!-- Indikator Antrean Real-Time (Ketuk Antrean untuk Force Sync) -->
    <div class="sync-bar">
      <div><span class="sync-dot" id="syncDot"></span><span id="syncText">Database Siap</span></div>
      <div class="queue-force-btn" id="queueCount" onclick="paksaKirimSekarang()" title="Ketuk untuk kirim ulang sekarang">Antrean: 0</div>
    </div>

    <div id="statusBox"></div>

    <!-- Kartu Kamera Scanner -->
    <div class="card scanner-card" id="scannerCard">
      <div class="card-inner">
        <div id="reader-wrapper">
          <div class="cam-corners">
            <span></span><span></span><span></span><span></span>
          </div>
          <div id="reader"></div>
        </div>
      </div>
    </div>

    <!-- Kartu Input Manual -->
    <div class="card" id="manualCard">
      <div class="card-inner">
        <label for="manualInput">Manual Override (SPXID06 / ID)</label>
        <div class="manual-row">
          <input type="text" id="manualInput" placeholder="Contoh: SPXID06... atau ID..." onkeydown="if(event.key==='Enter') kirimManual()">
          <button class="btn-manual" onclick="kirimManual()">TRANSMIT</button>
        </div>
      </div>
    </div>

    <!-- Kartu Riwayat Transmisi (2 Baris + Scrollable) -->
    <div class="card history-card" id="historyCard">
      <div class="card-inner">
        <div class="history-header">
          <span style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-sub);">Log Transmisi</span>
          <span class="badge" id="scanCounter">0 SESI</span>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-placeholder" style="text-align:center; color:var(--text-sub); font-size:11px; padding:28px 10px; opacity:0.6;">NO DATA RECORDED</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL KONFIRMASI ARSIP BERPASSWORD 1110 -->
  <div id="archiveModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">ARSIPKAN 32 SHEET KURIR</div>
      <div class="modal-desc">
        Pindahkan seluruh data dari <b>32 sheet kurir (urut A–Z)</b> ke <b>Resi History</b> dan kosongkan data kurir. Masukkan password:
      </div>
      <input type="password" id="archivePassInput" class="modal-pass" inputmode="numeric" maxlength="10" placeholder="••••">
      <div class="modal-btns">
        <button class="btn-modal-cancel" onclick="tutupModalArsip()">BATAL</button>
        <button class="btn-modal-ok" onclick="prosesArsipData()">ARSIPKAN</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzgdXi9GUYGHxeo71WL-Ki-cedn2fu38A1tJV2bGPCjOHU-A_hh9TrMIstEDcnH3npIqA/exec';
    const STORAGE_QUEUE_KEY = 'spx_pending_queue_backup_v2';

    // --- Pengaturan Antrean & Retry ---
    const SYNC_INTERVAL_MS = 2500;      // Interval kirim 2,5 detik
    const MAX_RETRY_PER_ITEM = 50;      // Maksimal 50 kali percobaan ulang
    const FETCH_TIMEOUT_MS = 25000;     // Batas waktu 1 request kirim (25 detik)
    const BATCH_SIZE = 25;              // Maksimal resi per kiriman
    const DEBOUNCE_SCAN_MS = 1500;      // Jeda scan kode yang sama

    const WHITELIST_KURIR = [
      'INDRA AMTA ZIANSYAH', 'MATTASSLIM', 'MOH ISMAIL ZAKARIYA', 'ZAKARIYA',
      'ZAINUL FATAH', 'QOMARULLAH', 'SANI', 'MUHAMMAD RIDWAN', 'ABDUL HALIM',
      'SAHRUL ANAM', 'KHAIRUDDIN', 'HAMDANI', 'NURUL ANWAR',
      'MASRUDI', 'ABD MAJID', 'SUMARI', 'WASIS BUDIONO',
      'ARMAN SUSIANTO', 'ABDURRAHMAN', 'MOH SAHRIL', 'DWI AGUSTIONO',
      'MIFTAHUL GHANI', 'IRVAN FAUZY', 'MUHAMMAD AINUS SYAMSI',
      'MUHAMMAD NURULLAH AJI SAPUTRA', 'MOHAMMAD HARIS', 'SANDI AGUSTINO',
      'EDY MUCHLAS', 'MOH. MAULANA TAQWIM', 'ABD MUTHALIB',
      'MOH. TRIOWAN KURNIA', 'AMIRIL MUKMININ'
    ].sort((a, b) => a.localeCompare(b, 'id'));

    let html5QrCode = null;
    let isScanning = false;
    let isTorchOn = false;
    let wakeLock = null;
    let lastScannedCode = '';
    let lastScannedTime = 0;
    let sessionScanCount = 0;

    // Menyimpan jumlah baris riil yang terkonfirmasi ada di Google Sheets
    let sheetKurirCounts = {};
    let audioCtx = null;

    const localCache = new Set();
    let uploadQueue = [];
    let isSyncing = false;
    let archiveInProgress = false;

    // =========================================================================
    // PENYIMPANAN ANTREAN LOKAL (localStorage)
    // =========================================================================
    function simpanCadanganLokal() {
      try {
        localStorage.setItem(STORAGE_QUEUE_KEY, JSON.stringify(uploadQueue));
      } catch (e) {}
    }

    function buatItemRiwayat(itemId, resi, kurir, waktu) {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.id = itemId;

      const kiri = document.createElement('div');

      const elResi = document.createElement('div');
      elResi.className = 'history-resi';
      elResi.textContent = resi;

      const elMeta = document.createElement('div');
      elMeta.className = 'history-meta';
      elMeta.appendChild(document.createTextNode('KURIR: '));
      const elKurir = document.createElement('b');
      elKurir.style.color = 'var(--orange-bright)';
      elKurir.textContent = kurir;
      elMeta.appendChild(elKurir);
      elMeta.appendChild(document.createTextNode(' • ' + waktu));

      kiri.appendChild(elResi);
      kiri.appendChild(elMeta);

      const tag = document.createElement('span');
      tag.className = 'tag-status tag-pending';
      tag.id = 'status-' + itemId;
      tag.textContent = 'MENGIRIM...';

      item.appendChild(kiri);
      item.appendChild(tag);
      return item;
    }

    function hapusPlaceholderRiwayat() {
      const ph = document.querySelector('#historyList .empty-placeholder');
      if (ph) ph.remove();
    }

    function pulihkanCadanganLokal() {
      try {
        const savedQueue = localStorage.getItem(STORAGE_QUEUE_KEY);
        if (savedQueue) {
          const parsedQueue = JSON.parse(savedQueue);
          if (Array.isArray(parsedQueue) && parsedQueue.length > 0) {
            const list = document.getElementById('historyList');
            hapusPlaceholderRiwayat();
            parsedQueue.forEach(item => {
              if (!item || !item.id || !item.kurir || !item.resi) return;
              item.retryCount = Number(item.retryCount) || 0;
              uploadQueue.push(item);
              localCache.add(item.kurir + '::' + item.resi);

              const jamSingkat = (item.timestamp || '').split(' ')[1] || item.timestamp || '';
              list.prepend(buatItemRiwayat(item.id, item.resi, item.kurir, jamSingkat));
            });
            updateQueueUI();
            tampilkanStatus('duplicate', '⏳ ' + uploadQueue.length + ' resi belum terkirim, mengirim ulang...');
          }
        }
      } catch (e) {}
    }

    // =========================================================================
    // HARD BLOCK NAVIGASI (BACK / REFRESH / CLOSE)
    // =========================================================================
    function pasangKunciBack() {
      try {
        if (!(history.state && history.state.spxLock)) {
          history.pushState({ spxLock: true }, '', location.href);
        }
      } catch (e) {}
    }

    function aktifkanHardBlockNavigasi() {
      pasangKunciBack();

      window.addEventListener('popstate', function () {
        if (uploadQueue.length > 0 || isSyncing) {
          try { history.pushState({ spxLock: true }, '', location.href); } catch (e) {}
          suaraErrorKeras();
          if (navigator.vibrate) navigator.vibrate([150, 70, 150]);
          triggerVisualFeedback('error', 'historyCard');
          tampilkanStatus('error', '⛔ JANGAN KELUAR! Masih ada ' + uploadQueue.length + ' resi dalam antrean.');
          prosesAntreanBatch();
        }
      });

      window.addEventListener('beforeunload', function (e) {
        simpanCadanganLokal();
        if (uploadQueue.length > 0 || isSyncing) {
          e.preventDefault();
          e.returnValue = 'Masih ada resi berstatus MENGIRIM!';
          return e.returnValue;
        }
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          simpanCadanganLokal();
        } else if (document.visibilityState === 'visible') {
          if (isScanning) mintaWakeLock();
          if (uploadQueue.length > 0) prosesAntreanBatch();
        }
      });

      window.addEventListener('pagehide', function () {
        simpanCadanganLokal();
      });
    }

    // =========================================================================
    // SCREEN WAKE LOCK
    // =========================================================================
    async function mintaWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {}
    }

    async function lepasWakeLock() {
      try {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {}
    }

    function pastikanVideoBackgroundBerputar() {
      const bgVid = document.getElementById('bgHudVideo');
      if (bgVid && bgVid.paused) {
        bgVid.muted = true;
        bgVid.play().catch(() => {});
      }
    }
    ['touchstart', 'pointerdown', 'click', 'change'].forEach(evt => {
      document.addEventListener(evt, pastikanVideoBackgroundBerputar, { passive: true });
    });

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function formatWaktuScanLokal(dateObj) {
      const pad = (n) => String(n).padStart(2, '0');
      const tahun = dateObj.getFullYear();
      const bulan = pad(dateObj.getMonth() + 1);
      const tanggal = pad(dateObj.getDate());
      const jam = pad(dateObj.getHours());
      const menit = pad(dateObj.getMinutes());
      const detik = pad(dateObj.getSeconds());
      return {
        jamSingkat: `${jam}:${menit}:${detik}`,
        timestampLengkap: `${tanggal}/${bulan}/${tahun} ${jam}:${menit}:${detik}`
      };
    }

    function triggerVisualFeedback(type, targetCardId) {
      const flash = document.getElementById('flashOverlay');
      flash.className = 'flash-overlay';
      void flash.offsetWidth;
      flash.classList.add('flash-' + type);

      if (type === 'success') {
        const robot = document.getElementById('robotMascot');
        robot.classList.remove('robot-happy');
        void robot.offsetWidth;
        robot.classList.add('robot-happy');

        const scanCard = document.getElementById('scannerCard');
        scanCard.classList.add('pulse-success-card');
        setTimeout(() => scanCard.classList.remove('pulse-success-card'), 450);
      } else {
        const card = document.getElementById(targetCardId || 'scannerCard');
        card.classList.remove('shake-anim');
        void card.offsetWidth;
        card.classList.add('shake-anim');
        setTimeout(() => card.classList.remove('shake-anim'), 450);
      }
    }

    // Menampilkan jumlah riil di Google Sheets + jumlah antrean tertunda di HP
    function updateKurirCounterPill() {
      const kurir = document.getElementById('kurirSelect').value;
      const pill = document.getElementById('kurirCounterPill');
      if (!kurir) {
        pill.textContent = 'SHEET: 0 RESI';
        return;
      }
      const jmlSheet = sheetKurirCounts[kurir] || 0;
      const jmlAntreKurir = uploadQueue.filter(item => item.kurir === kurir).length;
      if (jmlAntreKurir > 0) {
        pill.textContent = `SHEET: ${jmlSheet} (+${jmlAntreKurir} ANTRE)`;
      } else {
        pill.textContent = `SHEET: ${jmlSheet} RESI`;
      }
    }

    async function muatDataSheetServer() {
      try {
        const response = await fetch(WEB_APP_URL);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const res = await response.json();

        if (res.status === 'success') {
          if (res.counts && typeof res.counts === 'object') {
            sheetKurirCounts = res.counts;
            updateKurirCounterPill();
          }
          if (Array.isArray(res.data) && res.data.length > 0) {
            const allowedSet = new Set(WHITELIST_KURIR.map(n => n.toUpperCase()));
            const daftar = res.data.map(n => String(n).trim())
              .filter(n => allowedSet.has(n.toUpperCase()))
              .sort((a, b) => a.localeCompare(b, 'id'));
            if (daftar.length > 0) return daftar;
          }
        }
      } catch (e) {}
      return WHITELIST_KURIR;
    }

    function isiDropdownKurir(select, daftarKurir) {
      const nilaiSebelumnya = select.value;
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-- PILIH NAMA KURIR --';
      select.appendChild(placeholder);

      daftarKurir.forEach(kurir => {
        const opt = document.createElement('option');
        opt.value = kurir;
        opt.textContent = kurir;
        select.appendChild(opt);
      });

      if (nilaiSebelumnya && daftarKurir.includes(nilaiSebelumnya)) {
        select.value = nilaiSebelumnya;
      }
    }

    async function onKurirChange() {
      const select = document.getElementById('kurirSelect');
      if (select.value) {
        select.classList.remove('select-empty');
        document.getElementById('statusBox').style.display = 'none';
        updateKurirCounterPill();
        // Segarkan angka riil dari sheet saat kurir dipilih
        await muatDataSheetServer();
      } else {
        select.classList.add('select-empty');
        updateKurirCounterPill();
      }
    }

    window.onload = async function() {
      html5QrCode = new Html5Qrcode("reader");
      aktifkanHardBlockNavigasi();
      pastikanVideoBackgroundBerputar();
      pulihkanCadanganLokal();

      const skeleton = document.getElementById('kurirSkeleton');
      const select = document.getElementById('kurirSelect');

      const daftarKurir = await muatDataSheetServer();
      isiDropdownKurir(select, daftarKurir);

      skeleton.style.display = 'none';
      select.style.display = 'block';
      updateKurirCounterPill();
      updateQueueUI();

      setInterval(prosesAntreanBatch, SYNC_INTERVAL_MS);
    };

    // =========================================================================
    // KAMERA & SENTER
    // =========================================================================
    async function toggleKamera() {
      initAudio();
      const kurir = document.getElementById('kurirSelect').value;

      if (!isScanning && !kurir) {
        suaraErrorKeras();
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        triggerVisualFeedback('error', 'kurirCard');
        tampilkanStatus('error', '⚠️ PILIH NAMA KURIR TERLEBIH DAHULU!');
        document.getElementById('kurirSelect').focus();
        return;
      }

      const btnCam = document.getElementById('btnKamera');
      const btnTorch = document.getElementById('btnSenter');
      const wrapper = document.getElementById('reader-wrapper');

      if (!isScanning) {
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            {
              fps: 20,
              aspectRatio: 1.333334,
              qrbox: function(viewfinderWidth, viewfinderHeight) {
                return {
                  width: Math.floor(viewfinderWidth * 0.94),
                  height: Math.floor(viewfinderHeight * 0.94)
                };
              }
            },
            onScanSuccess,
            () => {}
          );
          isScanning = true;
          mintaWakeLock();
          wrapper.classList.add('cam-active');
          btnCam.textContent = '⏹';
          btnCam.className = 'icon-corner-btn btn-cam-stop';
          btnTorch.disabled = false;
          document.getElementById('statusBox').style.display = 'none';
        } catch (err) {
          tampilkanStatus('error', 'KAMERA DITOLAK: ' + err);
        }
      } else {
        if (isTorchOn) await setTorchState(false);
        await html5QrCode.stop();
        isScanning = false;
        lepasWakeLock();
        wrapper.classList.remove('cam-active');
        btnCam.textContent = '📷';
        btnCam.className = 'icon-corner-btn btn-cam-start';
        btnTorch.disabled = true;
      }
    }

    async function toggleSenter() {
      if (!isScanning) return;
      await setTorchState(!isTorchOn);
    }

    async function setTorchState(state) {
      const btnTorch = document.getElementById('btnSenter');
      try {
        await html5QrCode.applyVideoConstraints({ advanced: [{ torch: state }] });
        isTorchOn = state;
        btnTorch.className = isTorchOn ? 'icon-corner-btn btn-torch-on' : 'icon-corner-btn btn-torch-off';
      } catch (err) {
        tampilkanStatus('error', 'SENTER TIDAK DIDUKUNG PERANGKAT INI.');
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastScannedCode && (now - lastScannedTime) < DEBOUNCE_SCAN_MS) return;
      lastScannedCode = decodedText;
      lastScannedTime = now;

      masukkanKeAntrean(decodedText);
    }

    function kirimManual() {
      initAudio();
      const input = document.getElementById('manualInput');
      if (!input.value.trim()) {
        suaraErrorKeras();
        triggerVisualFeedback('error', 'manualCard');
        tampilkanStatus('error', 'Masukkan nomor resi terlebih dahulu.');
        return;
      }
      masukkanKeAntrean(input.value.trim());
      input.value = '';
    }

    function masukkanKeAntrean(nomorResi) {
      if (archiveInProgress) {
        tampilkanStatus('error', 'ARSIP SEDANG DIPROSES. TUNGGU SELESAI.');
        return;
      }
      const kurir = document.getElementById('kurirSelect').value;
      const resiBersih = String(nomorResi).trim().toUpperCase();

      if (!kurir) {
        suaraErrorKeras();
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        triggerVisualFeedback('error', 'kurirCard');
        tampilkanStatus('error', '⚠️ PILIH NAMA KURIR TERLEBIH DAHULU!');
        return;
      }

      if (!(resiBersih.startsWith('SPXID06') || resiBersih.startsWith('ID'))) {
        suaraErrorKeras();
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        triggerVisualFeedback('error', 'scannerCard');
        tampilkanStatus('error', '⛔ DITOLAK: resi harus diawali SPXID06 atau ID.');
        return;
      }

      const cacheKey = kurir + '::' + resiBersih;
      if (localCache.has(cacheKey)) {
        suaraErrorKeras();
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        triggerVisualFeedback('duplicate', 'scannerCard');
        tampilkanStatus('duplicate', '⚠️ DUPLIKAT LOKAL: ' + resiBersih + ' sudah di-scan!');
        return;
      }

      localCache.add(cacheKey);
      suaraSuksesKeras();
      if (navigator.vibrate) navigator.vibrate(90);
      triggerVisualFeedback('success', 'scannerCard');

      const waktu = formatWaktuScanLokal(new Date());
      const itemId = 'item-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

      uploadQueue.push({
        id: itemId,
        kurir: kurir,
        resi: resiBersih,
        timestamp: waktu.timestampLengkap,
        cekDuplikat: true,
        retryCount: 0
      });

      simpanCadanganLokal();
      updateQueueUI();
      updateKurirCounterPill();
      tampilkanStatus('success', '⚡ MASUK ANTREAN: ' + resiBersih);
      tambahKeRiwayat(itemId, resiBersih, kurir, waktu.jamSingkat);
    }

    function paksaKirimSekarang() {
      if (uploadQueue.length === 0) {
        tampilkanStatus('success', '✅ Semua data sudah tersinkron ke Google Sheets.');
        return;
      }
      if (!isSyncing) {
        prosesAntreanBatch();
      }
    }

    async function prosesAntreanBatch() {
      if (archiveInProgress || isSyncing || uploadQueue.length === 0) return;

      isSyncing = true;
      const batchToSend = uploadQueue.slice(0, BATCH_SIZE);
      updateSyncStatus(true, 'Mengirim ' + batchToSend.length + ' data...');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ items: batchToSend }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('HTTP ' + response.status);
        const res = await response.json();

        if (res.status === 'retry') {
          throw new Error(res.message || 'Server sibuk (antrean penuh).');
        }

        if (res.status !== 'success' || !Array.isArray(res.results)) {
          throw new Error(res.message || 'Respons server tidak valid.');
        }

        // Perbarui jumlah baris riil dari Google Sheets
        if (res.updatedCounts && typeof res.updatedCounts === 'object') {
          Object.assign(sheetKurirCounts, res.updatedCounts);
        }

        const resultById = new Map();
        res.results.forEach(result => {
          if (result && result.id) resultById.set(String(result.id), result);
        });

        const completedIds = new Set();
        batchToSend.forEach(item => {
          const hasil = resultById.get(String(item.id));
          const badgeEl = document.getElementById('status-' + item.id);
          const cardEl = document.getElementById(item.id);

          if (!hasil) {
            item.retryCount = (item.retryCount || 0) + 1;
            if (item.retryCount >= MAX_RETRY_PER_ITEM) {
              completedIds.add(item.id);
              if (badgeEl) {
                badgeEl.className = 'tag-status tag-dup';
                badgeEl.textContent = 'GAGAL (' + MAX_RETRY_PER_ITEM + 'x)';
              }
              if (cardEl) cardEl.classList.add('dup');
            } else if (badgeEl) {
              badgeEl.className = 'tag-status tag-pending';
              badgeEl.textContent = 'ULANG (' + item.retryCount + '/' + MAX_RETRY_PER_ITEM + ')';
            }
            return;
          }

          if (hasil.status === 'success') {
            completedIds.add(item.id);
            if (badgeEl) {
              badgeEl.className = 'tag-status tag-ok';
              badgeEl.textContent = 'TERSIMPAN #' + hasil.no;
            }
            if (cardEl) cardEl.classList.add('synced');
          } else if (hasil.status === 'duplicate') {
            completedIds.add(item.id);
            if (badgeEl) {
              badgeEl.className = 'tag-status tag-dup';
              badgeEl.textContent = 'DUPLIKAT SHEET';
            }
            if (cardEl) cardEl.classList.add('dup');
          } else if (hasil.status === 'invalid') {
            // Error validasi permanen: keluarkan langsung tanpa retry
            completedIds.add(item.id);
            if (badgeEl) {
              badgeEl.className = 'tag-status tag-dup';
              badgeEl.textContent = 'DITOLAK SERVER';
            }
            if (cardEl) cardEl.classList.add('dup');
            tampilkanStatus('error', '⛔ Ditolak permanen (' + item.resi + '): ' + (hasil.message || 'Data tidak valid'));
          } else {
            item.retryCount = (item.retryCount || 0) + 1;
            if (item.retryCount >= MAX_RETRY_PER_ITEM) {
              completedIds.add(item.id);
              if (badgeEl) {
                badgeEl.className = 'tag-status tag-dup';
                badgeEl.textContent = 'GAGAL (' + MAX_RETRY_PER_ITEM + 'x)';
              }
              if (cardEl) cardEl.classList.add('dup');
            } else if (badgeEl) {
              badgeEl.className = 'tag-status tag-pending';
              badgeEl.textContent = 'GAGAL (' + item.retryCount + '/' + MAX_RETRY_PER_ITEM + ')';
            }
          }
        });

        if (completedIds.size) {
          uploadQueue = uploadQueue.filter(item => !completedIds.has(item.id));
          completedIds.forEach(id => {
            const item = batchToSend.find(x => x.id === id);
            if (item) localCache.delete(item.kurir + '::' + item.resi);
          });
        }
        simpanCadanganLokal();
        updateKurirCounterPill();

        updateSyncStatus(uploadQueue.length > 0,
          uploadQueue.length ? uploadQueue.length + ' data menunggu / dicoba ulang' : 'Semua Data Tersinkron');

      } catch (err) {
        clearTimeout(timeoutId);
        const droppedIds = new Set();

        batchToSend.forEach(item => {
          item.retryCount = (item.retryCount || 0) + 1;
          const badgeEl = document.getElementById('status-' + item.id);
          const cardEl = document.getElementById(item.id);

          if (item.retryCount >= MAX_RETRY_PER_ITEM) {
            droppedIds.add(item.id);
            if (badgeEl) {
              badgeEl.className = 'tag-status tag-dup';
              badgeEl.textContent = 'GAGAL KIRIM (' + MAX_RETRY_PER_ITEM + 'x)';
            }
            if (cardEl) cardEl.classList.add('dup');
          } else if (badgeEl) {
            badgeEl.className = 'tag-status tag-pending';
            badgeEl.textContent = 'ANTRE ULANG (' + item.retryCount + '/' + MAX_RETRY_PER_ITEM + ')';
          }
        });

        if (droppedIds.size) {
          uploadQueue = uploadQueue.filter(item => !droppedIds.has(item.id));
          droppedIds.forEach(id => {
            const item = batchToSend.find(x => x.id === id);
            if (item) localCache.delete(item.kurir + '::' + item.resi);
          });
          tampilkanStatus('error', droppedIds.size + ' resi dibatalkan karena gagal terkirim ' + MAX_RETRY_PER_ITEM + ' kali.');
        }

        simpanCadanganLokal();
        updateKurirCounterPill();
        updateSyncStatus(uploadQueue.length > 0,
          uploadQueue.length ? 'Koneksi/Server sibuk. Mencoba ulang otomatis...' : 'Antrean selesai');
      } finally {
        isSyncing = false;
        updateQueueUI();
      }
    }

    // =========================================================================
    // MODAL ARSIP BERPASSWORD 1110
    // =========================================================================
    function bukaModalArsip() {
      if (archiveInProgress) return;
      if (isSyncing || uploadQueue.length > 0) {
        tampilkanStatus('error', 'TUNGGU SAMPAI ANTREAN RESI SELESAI TERSINKRON.');
        return;
      }
      document.getElementById('archivePassInput').value = '';
      document.getElementById('archiveModal').classList.add('open');
      setTimeout(() => document.getElementById('archivePassInput').focus(), 100);
    }

    function tutupModalArsip() {
      if (archiveInProgress) return;
      document.getElementById('archiveModal').classList.remove('open');
      document.getElementById('archivePassInput').value = '';
    }

    async function prosesArsipData() {
      if (archiveInProgress) return;
      const passInput = document.getElementById('archivePassInput');
      const password = passInput.value.trim();

      if (!password) {
        suaraErrorKeras();
        tampilkanStatus('error', 'Masukkan password arsip terlebih dahulu.');
        passInput.focus();
        return;
      }

      if (isSyncing || uploadQueue.length > 0) {
        tampilkanStatus('error', 'Masih ada antrean resi. Tunggu sinkronisasi selesai.');
        return;
      }

      archiveInProgress = true;
      updateSyncStatus(true, 'Mengarsipkan 32 sheet ke Resi History...');

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'archive', password: password })
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();

        if (result.status === 'success' || result.status === 'empty') {
          tutupModalArsip();
          localCache.clear();
          // Reset hitungan lokal menjadi 0 agar langsung sinkron dengan sheet yang baru dikosongkan
          Object.keys(sheetKurirCounts).forEach(k => { sheetKurirCounts[k] = 0; });
          updateKurirCounterPill();

          tampilkanStatus('success', '✅ ' + (result.message || 'Arsip selesai.'));
          updateSyncStatus(false, 'Arsip selesai');
          triggerVisualFeedback('success');
        } else {
          suaraErrorKeras();
          tampilkanStatus('error', '⛔ ' + (result.message || 'Password salah atau arsip gagal.'));
          updateSyncStatus(false, 'Arsip dibatalkan');
        }
      } catch (err) {
        suaraErrorKeras();
        tampilkanStatus('error', 'Gagal menghubungi server arsip: ' + err.message);
        updateSyncStatus(false, 'Koneksi arsip gagal');
      } finally {
        archiveInProgress = false;
      }
    }

    function updateQueueUI() {
      const el = document.getElementById('queueCount');
      el.textContent = 'Antrean: ' + uploadQueue.length;
      if (uploadQueue.length > 0) {
        el.classList.add('pending');
      } else {
        el.classList.remove('pending');
      }
    }

    function updateSyncStatus(isBusy, text) {
      const dot = document.getElementById('syncDot');
      dot.className = isBusy ? 'sync-dot busy' : 'sync-dot';
      document.getElementById('syncText').textContent = text;
    }

    function tampilkanStatus(tipe, pesan) {
      const box = document.getElementById('statusBox');
      box.className = '';
      void box.offsetWidth;
      box.className = 'status-' + tipe;
      box.textContent = pesan;
    }

    function tambahKeRiwayat(itemId, resi, kurir, waktu) {
      sessionScanCount++;
      document.getElementById('scanCounter').textContent = sessionScanCount + ' SESI';

      const list = document.getElementById('historyList');
      hapusPlaceholderRiwayat();
      list.prepend(buatItemRiwayat(itemId, resi, kurir, waktu));
    }

    // SISTEM AUDIO SUPER NYARING
    function suaraSuksesKeras() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-10, now);
        compressor.knee.setValueAtTime(0, now);
        compressor.ratio.setValueAtTime(20, now);
        compressor.attack.setValueAtTime(0, now);
        compressor.release.setValueAtTime(0.1, now);
        compressor.connect(audioCtx.destination);

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(1.0, now);
        masterGain.connect(compressor);

        const osc1 = audioCtx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(1500, now);
        osc1.frequency.setValueAtTime(2400, now + 0.08);
        osc1.connect(masterGain);

        const osc2 = audioCtx.createOscillator();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(3000, now);
        osc2.frequency.setValueAtTime(3600, now + 0.08);
        osc2.connect(masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.18);
        osc2.stop(now + 0.18);
      } catch (e) {}
    }

    function suaraErrorKeras() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(1.0, now);
        masterGain.connect(audioCtx.destination);

        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.setValueAtTime(220, now + 0.18);

        masterGain.gain.setValueAtTime(1.0, now);
        masterGain.gain.setValueAtTime(0.0, now + 0.14);
        masterGain.gain.setValueAtTime(1.0, now + 0.18);

        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }
  </script>
</body>
