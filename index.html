<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPX Express Turbo Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #090604;
      --bg-card: rgba(18, 12, 8, 0.86);
      --orange-neon: #ff5500;
      --orange-bright: #ff8800;
      --orange-glow: rgba(255, 85, 0, 0.45);
      --orange-dim: rgba(255, 85, 0, 0.14);
      --text-main: #f4f4f5;
      --text-sub: #d4d4d8;
      --border-color: rgba(255, 107, 0, 0.35);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      margin: 0; padding: 16px; 
      background: var(--bg-dark); 
      color: var(--text-main); 
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 1. BACKGROUND HUD BERGERAK & DIUBAH KE WARNA ORANGE */
    .bg-hud-layer {
      position: fixed;
      top: -5%; left: -5%;
      width: 110%; height: 110%;
      background-image: url('bg-hud.jpg.jfif');
      background-size: cover;
      background-position: center;
      filter: hue-rotate(175deg) saturate(260%) brightness(0.75) contrast(1.15);
      z-index: -2;
      pointer-events: none;
      animation: hudMotion 14s ease-in-out infinite alternate;
    }

    .bg-hud-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 8, 3, 0.45) 0%, rgba(5, 3, 2, 0.85) 100%);
      z-index: -1;
      pointer-events: none;
    }

    @keyframes hudMotion {
      0%   { transform: scale(1.0) translate(0px, 0px); opacity: 0.78; }
      50%  { transform: scale(1.06) translate(-8px, -10px); opacity: 0.95; }
      100% { transform: scale(1.03) translate(8px, 6px); opacity: 0.82; }
    }

    /* 2. MASKOT ROBOT POJOK KANAN ATAS (TANPA BACKGROUND) */
    .robot-mascot {
      position: fixed;
      top: 8px;
      right: 6px;
      width: 92px;
      height: auto;
      z-index: 999;
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(255, 85, 0, 0.55));
      animation: robotFloat 3.2s ease-in-out infinite;
    }

    @keyframes robotFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-2deg); }
    }

    .container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
    
    /* 3. HEADER & LOGO SPX DI TENGAH */
    .header { 
      text-align: center; 
      margin-top: 12px;
      margin-bottom: 18px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .center-logo {
      width: 175px;
      max-width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 6px auto;
      filter: drop-shadow(0 0 12px rgba(255, 85, 0, 0.65));
    }
    .header p { 
      margin: 2px 0 0; font-size: 11px; font-weight: 700;
      color: var(--orange-bright); letter-spacing: 1.5px; 
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
    }

    /* Kartu Glassmorphism Futuristic */
    .card { 
      background: var(--bg-card); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px; padding: 16px; margin-bottom: 14px; 
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), inset 0 0 15px rgba(255, 85, 0, 0.06);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange-neon), transparent);
    }

    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    select, input[type="text"] {
      width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.85); color: var(--text-main); font-size: 15px; outline: none; transition: 0.3s;
    }
    select:focus, input[type="text"]:focus { 
      border-color: var(--orange-neon); 
      box-shadow: 0 0 0 3px var(--orange-dim); 
    }

    .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .checkbox-row input { width: 18px; height: 18px; accent-color: var(--orange-neon); cursor: pointer; }
    .checkbox-row label { margin: 0; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; }

    #reader-wrapper { 
      position: relative; width: 100%; border-radius: 14px; overflow: hidden; 
      background: #000; min-height: 240px; border: 1px solid var(--border-color);
    }
    #reader { width: 100%; }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    button {
      padding: 13px 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; 
      transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-cam-start { background: linear-gradient(135deg, #ff7b00, #ff3d00); color: #fff; box-shadow: 0 4px 15px var(--orange-glow); }
    .btn-cam-stop { background: rgba(0, 0, 0, 0.6); color: var(--orange-bright); border: 1px solid var(--orange-neon); }
    .btn-torch-off { background: rgba(20, 20, 22, 0.9); color: var(--text-sub); border: 1px solid var(--border-color); }
    .btn-torch-on { background: #fff; color: #000; box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); }
    .btn-manual { background: var(--orange-dim); color: var(--orange-bright); width: 100%; margin-top: 10px; border: 1px solid var(--orange-neon); }

    /* Bar Status Antrean Sinkronisasi */
    .sync-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.85); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 10px 14px; margin-bottom: 14px; font-size: 12px;
      backdrop-filter: blur(6px);
    }
    .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #10b981; }
    .sync-dot.busy { background: #ff6b00; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    #statusBox {
      display: none; padding: 12px; border-radius: 12px; margin-bottom: 14px;
      font-size: 13px; font-weight: 600; text-align: center;
      backdrop-filter: blur(6px);
    }
    .status-success { display: block !important; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; }
    .status-duplicate { display: block !important; background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #fbbf24; }
    .status-error { display: block !important; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }

    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge { background: var(--orange-neon); color: #fff; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 800; }
    .history-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .history-item {
      background: rgba(0, 0, 0, 0.8); padding: 10px 14px; border-radius: 10px; 
      border-left: 3px solid #f59e0b;
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }
    .history-item.synced { border-left-color: #10b981; }
    .history-item.dup { border-left-color: #ef4444; opacity: 0.7; }
    .history-resi { font-weight: 700; color: #fff; font-family: monospace; font-size: 14px; }
    .history-meta { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
    .tag-status { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
    .tag-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .tag-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .tag-dup { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>
  <!-- Layer 1: Background HUD Bergerak Berwarna Orange -->
  <div class="bg-hud-layer"></div>
  <div class="bg-hud-overlay"></div>

  <!-- Layer 2: Maskot Robot Pojok Kanan Atas (Otomatis Hapus Background Putih) -->
  <canvas id="robotCanvas" class="robot-mascot"></canvas>

  <div class="container">
    <!-- Layer 3: Logo SPX Express di Tengah -->
    <div class="header">
      <img src="Logo%20SPX.png" alt="SPX Express" class="center-logo">
      <p>TURBO SCANNER // SPXID06 ONLY</p>
    </div>

    <div class="card">
      <label for="kurirSelect">Target Database (Kurir)</label>
      <select id="kurirSelect">
        <option value="">Memuat target sistem...</option>
      </select>
      <div class="checkbox-row">
        <input type="checkbox" id="cekDuplikat" checked>
        <label for="cekDuplikat">Blokir duplikasi resi otomatis</label>
      </div>
    </div>

    <!-- Indikator Antrean Real-Time -->
    <div class="sync-bar">
      <div><span class="sync-dot" id="syncDot"></span><span id="syncText">Database Siap</span></div>
      <div style="color:var(--orange-bright); font-weight:700;" id="queueCount">Antrean: 0</div>
    </div>

    <div id="statusBox"></div>

    <div class="card">
      <div id="reader-wrapper">
        <div id="reader"></div>
      </div>
      <div class="btn-group">
        <button id="btnKamera" class="btn-cam-start" onclick="toggleKamera()">📷 ACTIVATE CAM</button>
        <button id="btnSenter" class="btn-torch-off" onclick="toggleSenter()" disabled>🔦 ILLUMINATE</button>
      </div>
    </div>

    <div class="card">
      <label for="manualInput">Manual Override (Wajib SPXID06)</label>
      <input type="text" id="manualInput" placeholder="Contoh: SPXID06123456789...">
      <button class="btn-manual" onclick="kirimManual()">TRANSMIT DATA</button>
    </div>

    <div class="card">
      <div class="history-header">
        <span style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--text-sub);">Log Transmisi</span>
        <span class="badge" id="scanCounter">0 SCAN</span>
      </div>
      <div class="history-list" id="historyList">
        <div style="text-align:center; color:var(--text-sub); font-size:12px; padding:18px; opacity:0.6;">NO DATA RECORDED</div>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyAncrO8ZkHSQxVFuLDj1vF1UvMh7Fpb-b-TuUgrOhXsPLQqmJokNcd90S5YcEGxIj4Lw/exec';

    let html5QrCode = null;
    let isScanning = false;
    let isTorchOn = false;
    let lastScannedCode = '';
    let lastScannedTime = 0;
    let totalScan = 0;
    let audioCtx = null;

    const localCache = new Set();
    let uploadQueue = [];
    let isSyncing = false;

    // Fungsi Otomatis Menghapus Background Putih pada Gambar Robot
    function renderTransparentRobot() {
      const img = new Image();
      img.src = 'robot-spx.jpg.jfif';
      img.onload = function() {
        const canvas = document.getElementById('robotCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const w = canvas.width;
        const h = canvas.height;
        const visited = new Uint8Array(w * h);

        const stack = [];
        for (let x = 0; x < w; x++) {
          stack.push(x);
          stack.push((h - 1) * w + x);
        }
        for (let y = 0; y < h; y++) {
          stack.push(y * w);
          stack.push(y * w + (w - 1));
        }

        while (stack.length > 0) {
          const idx = stack.pop();
          if (visited[idx]) continue;
          visited[idx] = 1;

          const p = idx * 4;
          const r = data[p], g = data[p + 1], b = data[p + 2];

          if (r > 235 && g > 235 && b > 235) {
            data[p + 3] = 0;
            const x = idx % w;
            const y = (idx - x) / w;
            if (x > 0) stack.push(idx - 1);
            if (x < w - 1) stack.push(idx + 1);
            if (y > 0) stack.push(idx - w);
            if (y < h - 1) stack.push(idx + w);
          }
        }
        ctx.putImageData(imgData, 0, 0);
      };
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    window.onload = async function() {
      renderTransparentRobot();
      html5QrCode = new Html5Qrcode("reader");
      const select = document.getElementById('kurirSelect');

      try {
        const response = await fetch(WEB_APP_URL);
        const res = await response.json();
        select.innerHTML = '';

        if (res.status === 'success' && res.data.length > 0) {
          res.data.forEach(function(kurir) {
            const opt = document.createElement('option');
            opt.value = kurir;
            opt.textContent = kurir;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = '<option value="">NO TARGET DETECTED</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">CONNECTION FAILED</option>';
        tampilkanStatus('error', 'Gagal terhubung ke Database: ' + err);
      }

      setInterval(prosesAntreanBatch, 2500);
    };

    async function toggleKamera() {
      initAudio();
      const btnCam = document.getElementById('btnKamera');
      const btnTorch = document.getElementById('btnSenter');

      if (!isScanning) {
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            {
              fps: 20,
              aspectRatio: 1.333334,
              qrbox: function(viewfinderWidth, viewfinderHeight) {
                return {
                  width: Math.floor(viewfinderWidth * 0.96),
                  height: Math.floor(viewfinderHeight * 0.96)
                };
              }
            },
            onScanSuccess,
            () => {}
          );
          isScanning = true;
          btnCam.textContent = '⏹ DEACTIVATE CAM';
          btnCam.className = 'btn-cam-stop';
          btnTorch.disabled = false;
          document.getElementById('statusBox').style.display = 'none';
        } catch (err) {
          tampilkanStatus('error', 'CAMERA ACCESS DENIED: ' + err);
        }
      } else {
        if (isTorchOn) await setTorchState(false);
        await html5QrCode.stop();
        isScanning = false;
        btnCam.textContent = '📷 ACTIVATE CAM';
        btnCam.className = 'btn-cam-start';
        btnTorch.disabled = true;
      }
    }

    async function toggleSenter() {
      if (!isScanning) return;
      await setTorchState(!isTorchOn);
    }

    async function setTorchState(state) {
      const btnTorch = document.getElementById('btnSenter');
      try {
        await html5QrCode.applyVideoConstraints({ advanced: [{ torch: state }] });
        isTorchOn = state;
        btnTorch.textContent = isTorchOn ? '🔦 LIGHT: ON' : '🔦 ILLUMINATE';
        btnTorch.className = isTorchOn ? 'btn-torch-on' : 'btn-torch-off';
      } catch (err) {
        tampilkanStatus('error', 'FLASHLIGHT NOT SUPPORTED ON THIS DEVICE.');
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastScannedCode && (now - lastScannedTime) < 1200) return;
      lastScannedCode = decodedText;
      lastScannedTime = now;

      masukkanKeAntrean(decodedText);
    }

    function kirimManual() {
      initAudio();
      const input = document.getElementById('manualInput');
      if (!input.value.trim()) {
        tampilkanStatus('error', 'Masukkan nomor resi terlebih dahulu.');
        return;
      }
      masukkanKeAntrean(input.value.trim());
      input.value = '';
    }

    function masukkanKeAntrean(nomorResi) {
      const kurir = document.getElementById('kurirSelect').value;
      const cekDuplikat = document.getElementById('cekDuplikat').checked;
      const resiBersih = String(nomorResi).trim().toUpperCase();

      if (!resiBersih.startsWith('SPXID06')) {
        suaraErrorKeras();
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        tampilkanStatus('error', '⛔ DITOLAK: "' + resiBersih + '" bukan resi SPXID06');
        return;
      }

      if (!kurir) {
        suaraErrorKeras();
        tampilkanStatus('error', 'Pilih kurir tujuan terlebih dahulu!');
        return;
      }

      const cacheKey = kurir + '::' + resiBersih;
      if (cekDuplikat && localCache.has(cacheKey)) {
        suaraErrorKeras();
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        tampilkanStatus('duplicate', '⚠️ DUPLIKAT LOKAL: ' + resiBersih + ' sudah di-scan!');
        return;
      }

      localCache.add(cacheKey);
      suaraSuksesKeras();
      if (navigator.vibrate) navigator.vibrate(100);

      const waktuLokal = new Date().toLocaleTimeString('id-ID', { hour12: false });
      const itemId = 'item-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

      uploadQueue.push({
        id: itemId,
        kurir: kurir,
        resi: resiBersih,
        cekDuplikat: cekDuplikat
      });

      updateQueueUI();
      tampilkanStatus('success', '⚡ MASUK ANTREAN: ' + resiBersih);
      tambahKeRiwayat(itemId, resiBersih, kurir, waktuLokal);
    }

    async function prosesAntreanBatch() {
      if (isSyncing || uploadQueue.length === 0) return;

      isSyncing = true;
      updateSyncStatus(true, 'Menyimpan ' + uploadQueue.length + ' data...');

      const batchToSend = uploadQueue.slice(0, 25);

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ items: batchToSend })
        });
        const res = await response.json();

        if (res.status === 'success' && Array.isArray(res.results)) {
          uploadQueue.splice(0, batchToSend.length);

          res.results.forEach((hasil, idx) => {
            const origItem = batchToSend[idx];
            if (!origItem) return;
            const badgeEl = document.getElementById('status-' + origItem.id);
            const cardEl = document.getElementById(origItem.id);

            if (hasil.status === 'success') {
              if (badgeEl) { badgeEl.className = 'tag-status tag-ok'; badgeEl.textContent = 'TERSIMPAN #' + hasil.no; }
              if (cardEl) cardEl.classList.add('synced');
            } else if (hasil.status === 'duplicate') {
              suaraErrorKeras();
              if (badgeEl) { badgeEl.className = 'tag-status tag-dup'; badgeEl.textContent = 'DUPLIKAT SHEET'; }
              if (cardEl) cardEl.classList.add('dup');
              tampilkanStatus('duplicate', '⚠️ ' + hasil.message);
            } else {
              if (badgeEl) { badgeEl.className = 'tag-status tag-dup'; badgeEl.textContent = 'GAGAL'; }
            }
          });
          updateSyncStatus(false, 'Semua Data Tersinkron');
        } else {
          updateSyncStatus(true, 'Antrean padat, mencoba ulang...');
        }
      } catch (err) {
        updateSyncStatus(true, 'Koneksi lambat, mengulang...');
      } finally {
        isSyncing = false;
        updateQueueUI();
      }
    }

    function updateQueueUI() {
      document.getElementById('queueCount').textContent = 'Antrean: ' + uploadQueue.length;
    }

    function updateSyncStatus(isBusy, text) {
      const dot = document.getElementById('syncDot');
      dot.className = isBusy ? 'sync-dot busy' : 'sync-dot';
      document.getElementById('syncText').textContent = text;
    }

    function tampilkanStatus(tipe, pesan) {
      const box = document.getElementById('statusBox');
      box.className = 'status-' + tipe;
      box.textContent = pesan;
    }

    function tambahKeRiwayat(itemId, resi, kurir, waktu) {
      totalScan++;
      document.getElementById('scanCounter').textContent = totalScan + ' SCAN';
      const list = document.getElementById('historyList');
      if (totalScan === 1) list.innerHTML = '';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.id = itemId;
      item.innerHTML = `
        <div>
          <div class="history-resi">${resi}</div>
          <div class="history-meta">KURIR: <b style="color:var(--orange-bright);">${kurir}</b> • ${waktu}</div>
        </div>
        <span class="tag-status tag-pending" id="status-${itemId}">MENGIRIM...</span>
      `;
      list.prepend(item);
    }

    // SISTEM AUDIO SUPER NYARING (MAX GAIN + COMPRESSOR)
    function suaraSuksesKeras() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-10, now);
        compressor.knee.setValueAtTime(0, now);
        compressor.ratio.setValueAtTime(20, now);
        compressor.attack.setValueAtTime(0, now);
        compressor.release.setValueAtTime(0.1, now);
        compressor.connect(audioCtx.destination);

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(1.0, now);
        masterGain.connect(compressor);

        const osc1 = audioCtx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(1500, now);
        osc1.frequency.setValueAtTime(2400, now + 0.08);
        osc1.connect(masterGain);

        const osc2 = audioCtx.createOscillator();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(3000, now);
        osc2.frequency.setValueAtTime(3600, now + 0.08);
        osc2.connect(masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.18);
        osc2.stop(now + 0.18);
      } catch (e) {}
    }

    function suaraErrorKeras() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(1.0, now);
        masterGain.connect(audioCtx.destination);

        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.setValueAtTime(220, now + 0.18);

        masterGain.gain.setValueAtTime(1.0, now);
        masterGain.gain.setValueAtTime(0.0, now + 0.14);
        masterGain.gain.setValueAtTime(1.0, now + 0.18);

        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }

    window.addEventListener('beforeunload', function (e) {
      if (uploadQueue.length > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  </script>
</body>
</html>
