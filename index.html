<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPXID06 Scanner - Futuristic</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* Tema Futuristic Modern - Base Orange */
    :root {
      --bg-dark: #09090b;
      --bg-card: #131316;
      --orange-neon: #ff6b00;
      --orange-glow: rgba(255, 107, 0, 0.4);
      --orange-dim: rgba(255, 107, 0, 0.1);
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      --border-color: #27272a;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg-dark); color: var(--text-main); }
    .container { max-width: 480px; margin: 0 auto; }
    
    /* Header */
    .header { text-align: center; margin-bottom: 20px; position: relative; }
    .header h2 { 
      margin: 0; font-size: 22px; font-weight: 800; color: var(--orange-neon); 
      text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 0 12px var(--orange-glow);
    }
    .header p { margin: 6px 0 0; font-size: 12px; color: var(--text-sub); letter-spacing: 0.8px; }

    /* Kartu (Card) */
    .card { 
      background: var(--bg-card); border-radius: 16px; padding: 18px; margin-bottom: 16px; 
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange-neon), transparent);
      opacity: 0.6;
    }

    label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Input & Select */
    select, input[type="text"] {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color);
      background: #000; color: var(--text-main); font-size: 15px; outline: none; transition: 0.3s;
    }
    select:focus, input[type="text"]:focus { 
      border-color: var(--orange-neon); 
      box-shadow: 0 0 0 3px var(--orange-dim); 
    }

    /* Checkbox */
    .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .checkbox-row input { width: 20px; height: 20px; accent-color: var(--orange-neon); cursor: pointer; }
    .checkbox-row label { margin: 0; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; }

    /* Area Kamera */
    #reader-wrapper { 
      position: relative; width: 100%; border-radius: 14px; overflow: hidden; 
      background: #000; min-height: 250px; border: 1px solid #333;
    }
    #reader { width: 100%; }

    /* Tombol Kontrol */
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    button {
      padding: 14px 12px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 0.5px;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-cam-start { 
      background: linear-gradient(135deg, #ff8a00, #ff4500); color: #fff; 
      box-shadow: 0 4px 15px var(--orange-glow); 
    }
    .btn-cam-stop { 
      background: transparent; color: var(--orange-neon); 
      border: 1px solid var(--orange-neon); 
    }
    .btn-torch-off { background: #1a1a1a; color: var(--text-sub); border: 1px solid var(--border-color); }
    .btn-torch-on { 
      background: #fff; color: #000; 
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); 
    }
    .btn-manual { 
      background: var(--orange-dim); color: var(--orange-neon); width: 100%; margin-top: 10px; 
      border: 1px solid var(--orange-glow);
    }
    .btn-manual:hover { background: var(--orange-glow); color: #fff; }

    /* Notifikasi Status */
    #statusBox {
      display: none; padding: 14px; border-radius: 12px; margin-bottom: 16px;
      font-size: 14px; font-weight: 600; text-align: center; letter-spacing: 0.5px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    
    .status-loading { display: block !important; background: rgba(0, 112, 243, 0.1); border: 1px solid #0070f3; color: #52a8ff; }
    .status-success { display: block !important; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; }
    .status-duplicate { display: block !important; background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; color: #fbbf24; }
    .status-error { display: block !important; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; }

    /* Riwayat Scan */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { 
      background: var(--orange-neon); color: #000; padding: 4px 10px; 
      border-radius: 99px; font-size: 12px; font-weight: 800;
      box-shadow: 0 0 8px var(--orange-glow);
    }
    .history-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    
    .history-item {
      background: #000; padding: 12px 14px; border-radius: 10px; 
      border-left: 3px solid var(--orange-neon);
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
      transition: 0.3s;
    }
    .history-item:hover { background: #0a0a0c; border-left-width: 6px; }
    .history-resi { font-weight: 700; color: #fff; font-family: 'Courier New', Courier, monospace; font-size: 15px; letter-spacing: 1px; }
    .history-meta { font-size: 11px; color: var(--text-sub); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Scanner UI</h2>
      <p>FILTER: SPXID06 ONLY // DATA LINK TO SPREADSHEETS</p>
    </div>

    <!-- Pilihan Kurir -->
    <div class="card">
      <label for="kurirSelect">Target Database (Kurir)</label>
      <select id="kurirSelect">
        <option value="">Memuat target sistem...</option>
      </select>
      <div class="checkbox-row">
        <input type="checkbox" id="cekDuplikat" checked>
        <label for="cekDuplikat">Blokir duplikasi resi otomatis</label>
      </div>
    </div>

    <!-- Status Notifikasi -->
    <div id="statusBox"></div>

    <!-- Kamera & Tombol Senter -->
    <div class="card">
      <div id="reader-wrapper">
        <div id="reader"></div>
      </div>
      <div class="btn-group">
        <button id="btnKamera" class="btn-cam-start" onclick="toggleKamera()">📷 ACTIVATE CAM</button>
        <button id="btnSenter" class="btn-torch-off" onclick="toggleSenter()" disabled>🔦 ILLUMINATE</button>
      </div>
    </div>

    <!-- Input Manual Cadangan -->
    <div class="card">
      <label for="manualInput">Manual Override (Wajib SPXID06)</label>
      <input type="text" id="manualInput" placeholder="Contoh: SPXID06123456789...">
      <button class="btn-manual" onclick="kirimManual()">TRANSMIT DATA</button>
    </div>

    <!-- Riwayat Scan Sesi Ini -->
    <div class="card">
      <div class="history-header">
        <span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-sub);">Log Transmisi</span>
        <span class="badge" id="scanCounter">0 SCAN</span>
      </div>
      <div class="history-list" id="historyList">
        <div style="text-align:center; color:var(--border-color); font-size:12px; padding:20px; font-weight:600; letter-spacing:1px;">
          NO DATA RECORDED
        </div>
      </div>
    </div>
  </div>

  <script>
    // TEMPEL URL WEB APP APPS SCRIPT ANDA DI BAWAH INI:
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyAncrO8ZkHSQxVFuLDj1vF1UvMh7Fpb-b-TuUgrOhXsPLQqmJokNcd90S5YcEGxIj4Lw/exec';

    let html5QrCode = null;
    let isScanning = false;
    let isTorchOn = false;
    let isProcessing = false;
    let totalScan = 0;

    // 1. Ambil daftar sheet kurir dari Apps Script
    window.onload = async function() {
      html5QrCode = new Html5Qrcode("reader");
      const select = document.getElementById('kurirSelect');

      if (WEB_APP_URL.includes('PASTE_URL')) {
        select.innerHTML = '<option value="">ERROR: SYSTEM URL NOT FOUND</option>';
        tampilkanStatus('error', 'SYSTEM HALTED: Isi WEB_APP_URL terlebih dahulu.');
        return;
      }

      try {
        const response = await fetch(WEB_APP_URL);
        const res = await response.json();
        select.innerHTML = '';

        if (res.status === 'success' && res.data.length > 0) {
          res.data.forEach(function(kurir) {
            const opt = document.createElement('option');
            opt.value = kurir;
            opt.textContent = kurir;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = '<option value="">NO TARGET DETECTED</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">CONNECTION FAILED</option>';
        tampilkanStatus('error', 'Gagal terhubung ke Database: ' + err);
      }
    };

    // 2. Nyalakan / Matikan Kamera (Full Box Ratio)
    async function toggleKamera() {
      const btnCam = document.getElementById('btnKamera');
      const btnTorch = document.getElementById('btnSenter');

      if (!isScanning) {
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            {
              fps: 15,
              aspectRatio: 1.333334,
              qrbox: function(viewfinderWidth, viewfinderHeight) {
                return {
                  width: Math.floor(viewfinderWidth * 0.96),
                  height: Math.floor(viewfinderHeight * 0.96)
                };
              }
            },
            onScanSuccess,
            () => {}
          );
          isScanning = true;
          btnCam.textContent = '⏹ DEACTIVATE CAM';
          btnCam.className = 'btn-cam-stop';
          btnTorch.disabled = false;
          document.getElementById('statusBox').style.display = 'none';
        } catch (err) {
          tampilkanStatus('error', 'CAMERA ACCESS DENIED: ' + err);
        }
      } else {
        await hentikanKamera();
      }
    }

    async function hentikanKamera() {
      if (html5QrCode && isScanning) {
        if (isTorchOn) await setTorchState(false);
        await html5QrCode.stop();
        isScanning = false;
        const btnCam = document.getElementById('btnKamera');
        const btnTorch = document.getElementById('btnSenter');
        btnCam.textContent = '📷 ACTIVATE CAM';
        btnCam.className = 'btn-cam-start';
        btnTorch.disabled = true;
      }
    }

    // 3. Kontrol Senter (Flashlight)
    async function toggleSenter() {
      if (!isScanning) return;
      await setTorchState(!isTorchOn);
    }

    async function setTorchState(state) {
      const btnTorch = document.getElementById('btnSenter');
      try {
        await html5QrCode.applyVideoConstraints({
          advanced: [{ torch: state }]
        });
        isTorchOn = state;
        btnTorch.textContent = isTorchOn ? '🔦 LIGHT: ON' : '🔦 ILLUMINATE';
        btnTorch.className = isTorchOn ? 'btn-torch-on' : 'btn-torch-off';
      } catch (err) {
        tampilkanStatus('error', 'FLASHLIGHT NOT SUPPORTED ON THIS DEVICE.');
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      prosesKirimResi(decodedText);
    }

    function kirimManual() {
      const input = document.getElementById('manualInput');
      if (!input.value.trim()) {
        tampilkanStatus('error', 'INPUT REQUIRED: Masukkan nomor resi.');
        return;
      }
      prosesKirimResi(input.value.trim());
      input.value = '';
    }

    // 4. Kirim Data via POST (Hanya menerima awalan SPXID06)
    async function prosesKirimResi(nomorResi) {
      const kurir = document.getElementById('kurirSelect').value;
      const cekDuplikat = document.getElementById('cekDuplikat').checked;
      const resiBersih = String(nomorResi).trim().toUpperCase();

      // FILTER: Tolak jika tidak diawali SPXID06
      if (!resiBersih.startsWith('SPXID06')) {
        isProcessing = true;
        bunyiBeep(300, 250);
        tampilkanStatus('error', '⛔ DITOLAK: "' + resiBersih + '" bukan resi SPXID06');
        setTimeout(() => { isProcessing = false; }, 1200);
        return;
      }

      if (!kurir) {
        tampilkanStatus('error', 'TARGET REQUIRED: Pilih kurir tujuan!');
        return;
      }

      isProcessing = true;
      bunyiBeep(880, 120);
      if (navigator.vibrate) navigator.vibrate(120);

      tampilkanStatus('loading', '⏳ TRANSMITTING: ' + resiBersih + '...');

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ kurir: kurir, resi: resiBersih, cekDuplikat: cekDuplikat })
        });
        const res = await response.json();

        if (res.status === 'success') {
          tampilkanStatus('success', '✅ STORED: ' + res.data.resi);
          tambahKeRiwayat(res.data);
        } else if (res.status === 'duplicate') {
          bunyiBeep(300, 300);
          tampilkanStatus('duplicate', '⚠️ ALERT: ' + res.message);
        } else {
          tampilkanStatus('error', '❌ ERROR: ' + res.message);
        }
      } catch (err) {
        tampilkanStatus('error', '❌ TRANSMISSION FAILED: ' + err);
      } finally {
        setTimeout(() => { isProcessing = false; }, 1800);
      }
    }

    function tampilkanStatus(tipe, pesan) {
      const box = document.getElementById('statusBox');
      box.className = 'status-' + tipe;
      box.textContent = pesan;
    }

    function tambahKeRiwayat(data) {
      totalScan++;
      document.getElementById('scanCounter').textContent = totalScan + ' SCAN';
      const list = document.getElementById('historyList');
      if (totalScan === 1) list.innerHTML = '';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div>
          <div class="history-resi">${data.resi}</div>
          <div class="history-meta">TARGET: <b style="color:var(--orange-neon);">${data.kurir}</b> • ${data.waktu}</div>
        </div>
        <div style="color:var(--text-sub); font-size:12px; font-weight:800;">ID#${data.no}</div>
      `;
      list.prepend(item);
    }

    function bunyiBeep(freq, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration);
      } catch (e) {}
    }
  </script>
</body>
</html>
